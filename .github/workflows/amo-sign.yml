name: AMO unlisted signing
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global web-ext
      - name: Require AMO signing credentials
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: test -n "$WEB_EXT_API_KEY" -a -n "$WEB_EXT_API_SECRET" || { echo 'Missing AMO signing secrets' >&2; exit 1; }
      - name: Sign unlisted extension
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: web-ext sign --source-dir extension --ignore-files package.sh --channel=unlisted --artifacts-dir signing
      - name: Build Linux package with signed Firefox bridge
        run: |
          set -euo pipefail
          shopt -s nullglob
          xpis=(signing/*.xpi)
          test "${#xpis[@]}" -eq 1
          python scripts/build_package.py --output-dir artifacts --signed-xpi "${xpis[0]}" --expect-version "${GITHUB_REF_NAME#v}"
          cd artifacts
          sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: artifacts/*

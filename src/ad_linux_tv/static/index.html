<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ad-linux-tv</title>
<link rel="stylesheet" href="/style.css">
<main>
  <section id="home">
    <header class="topbar">
      <div><p class="eyebrow">ad-linux-tv</p><h1>Медиацентр</h1><p class="subtitle">Выберите сервис</p></div>
      <div class="topbar-right">
        <button id="system-button" type="button" aria-label="Открыть систему">⚙ Система</button>
        <div class="status-area"><p id="config-status"></p><p id="bridge-status"></p><p id="command-status"></p></div>
      </div>
    </header>
    <div class="home-content">
      <div class="services-area">
        <nav id="tiles" aria-label="Сервисы"></nav>
        <div class="pagination"><button id="prev">← Предыдущая</button><span id="page"></span><button id="next">Следующая →</button></div>
      </div>
      <aside id="remote-setup">
        <p class="eyebrow">Пульт на телефоне</p>
        <h2>Сканируйте QR-код</h2>
        <img id="qr" alt="QR-код пульта" hidden>
        <p id="pairing-pin" class="pairing-pin" hidden></p>
        <p id="address"></p>
        <p class="hint">Телефон и Beelink должны быть в одной домашней сети.</p>
      </aside>
    </div>
  </section>
  <section id="settings" hidden>
    <p class="eyebrow">ad-linux-tv</p><h1>Система</h1>
    <div class="settings-actions"><button id="settings-back">← К сервисам</button><button id="open-kde">Выйти из ТВ-режима → KDE</button></div>
    <div id="confirm-kde" hidden><p>Закрыть ТВ-режим и открыть KDE?</p><button id="cancel-kde">Отмена</button><button id="confirm-kde-yes">Да, открыть KDE</button></div>
    <p id="system-status" role="status"></p>
  </section>
</main>
<script src="/layout.js"></script>
<script src="/launcher_ui.js"></script>
<script src="/app.js"></script>
</html>
